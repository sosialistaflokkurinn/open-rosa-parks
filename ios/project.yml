name: RosaParks
options:
  bundleIdPrefix: is.rosaparks
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 4

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"

targets:
  RosaParks:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseCrashlytics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: is.rosaparks
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: "Rósa Parks"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
      configs:
        # Manual signing must live on the app target only: passing these as
        # xcodebuild command-line overrides applies them to every SPM package
        # target, and package targets reject provisioning profiles (Build 4,
        # runs 29518839796/29519348772). Debug stays unsigned for simulator CI.
        Release:
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: B4724Z74TM
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Rosa Parks App Store"
          CODE_SIGNING_REQUIRED: "YES"
          CODE_SIGNING_ALLOWED: "YES"
    scheme:
      testTargets:
        - RosaParksTests

  RosaParksTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: RosaParks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: is.rosaparks.tests
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
