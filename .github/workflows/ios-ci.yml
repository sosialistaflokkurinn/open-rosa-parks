name: iOS CI

on:
  push:
    branches: [master]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ci.yml'

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          xcodebuild build \
            -project RosaParks.xcodeproj \
            -scheme RosaParks \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Run tests
        run: |
          xcodebuild test \
            -project RosaParks.xcodeproj \
            -scheme RosaParks \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: RosaParks-simulator
          path: ios/build/Build/Products/Debug-iphonesimulator/RosaParks.app
          retention-days: 14
